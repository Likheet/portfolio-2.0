name: Refresh open-source contributions

# Daily: fetch merged pull requests into lib/open-source.json. When it changed,
# commit it and run the deploy workflow (a push made with the workflow token
# does not start other workflows by itself).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch merged pull requests
        run: node scripts/fetch-open-source.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit and deploy if changed
        run: |
          if git diff --quiet -- lib/open-source.json; then
            echo "No new merged pull requests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh open-source contributions" -- lib/open-source.json
          git push
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
